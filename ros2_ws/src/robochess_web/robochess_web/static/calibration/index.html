<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>RoboChess — Calibration du plateau</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; margin: 0; padding: 1rem; }
    #stage { position: relative; max-width: 960px; margin: 0 auto; }
    #camera-frame, #overlay { position: absolute; top: 0; left: 0; width: 100%; }
    #overlay { pointer-events: none; }
    #status-bar { max-width: 960px; margin: 1rem auto; padding: 0.75rem 1rem; border-radius: 6px; background: #222; }
    #status-bar.warning { background: #5a2a2a; }
    .controls { max-width: 960px; margin: 1rem auto; display: flex; gap: 0.5rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    #camera-frame { cursor: crosshair; }
  </style>
</head>
<body>
  <h1>Calibration du plateau</h1>
  <div id="status-bar">Chargement…</div>
  <div id="stage">
    <!-- Le flux vidéo en direct (ZED X) est fourni par ailleurs (zed-ros2-wrapper) ;
         hors scope de cette feature, cf. contracts/calibration-api.md. -->
    <img id="camera-frame" src="/camera/live" alt="Flux caméra en direct" />
    <canvas id="overlay"></canvas>
  </div>
  <div class="controls">
    <button id="confirm-btn" hidden>Confirmer</button>
    <button id="discard-btn" hidden>Annuler</button>
    <button id="recalibrate-btn" hidden>Recalibrer</button>
  </div>
  <script src="calibration.js"></script>
</body>
</html>
